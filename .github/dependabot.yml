version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: ["type:process", "area:release"]
    assignees: [lumenpearson]
    milestone: 5
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["type:process", "area:release"]
    assignees: [lumenpearson]
    milestone: 5
    commit-message:
      prefix: build
    groups:
      compatible-updates:
        update-types: [minor, patch]

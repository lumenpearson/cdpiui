name: CI

on:
  push:
    branches: [ main, dev, 'fix/**' ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libraries:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Create build secrets stub
        shell: pwsh
        run: ./.github/scripts/create_secret_stub.ps1

      - name: Build
        run: |
          dotnet build CDPIUI.Shared/CDPIUI.Shared.csproj -c Release
          dotnet build CDPIUI.Core/CDPIUI.Core.csproj -c Release -p:Platform=x64
          dotnet build CDPIUI.AddOns/CDPIUI.AddOns.csproj -c Release
          dotnet build CDPIUI.TrayIcon/CDPIUI.TrayIcon.csproj -c Release -p:Platform=x64

      - name: Test
        run: dotnet test CDPIUI.Tests/CDPIUI.Tests.csproj -c Release

      # Direct and transitive packages with a known vulnerability of moderate or higher severity fail the job.
      - name: Check packages for known vulnerabilities
        shell: pwsh
        run: |
          $projects = @(
            @('CDPIUI.Shared/CDPIUI.Shared.csproj', ''),
            @('CDPIUI.Core/CDPIUI.Core.csproj', '-p:Platform=x64'),
            @('CDPIUI.AddOns/CDPIUI.AddOns.csproj', ''),
            @('CDPIUI.TrayIcon/CDPIUI.TrayIcon.csproj', '-p:Platform=x64'),
            @('CDPIUI/CDPIUI.csproj', '-p:Platform=x64'),
            @('CDPIUI.Tests/CDPIUI.Tests.csproj', '')
          )
          foreach ($project in $projects) {
            $extra = @($project[1] | Where-Object { $_ })
            dotnet restore $project[0] @extra --force -p:NuGetAuditMode=all -p:NuGetAuditLevel=moderate "-p:WarningsAsErrors=NU1902%3BNU1903%3BNU1904"
            if ($LASTEXITCODE -ne 0) { throw "Vulnerable packages in $($project[0])" }
          }

  gui:
    runs-on: windows-latest
    # The WinUI project needs the CommunityToolkit Labs feed and the Windows App SDK
    # tooling; keep it informative until the build is reproducible on hosted runners.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: microsoft/setup-msbuild@v2

      - name: Build portable layout
        shell: pwsh
        run: ./.github/scripts/build_portable.ps1

      - name: Check installer file list
        shell: pwsh
        run: ./.github/scripts/check_setup_files.ps1

      - name: Build Setup.msi
        run: dotnet build NewSetup/NewSetup.wixproj -c Release -p:Platform=x64

      - uses: actions/upload-artifact@v4
        with:
          name: setup-msi
          path: NewSetup/bin/**/*.msi
          retention-days: 7

  tools:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The same commands as build_portable.ps1: framework-dependent single-file executables.
      - name: Build and publish Update and EditHostFile
        shell: pwsh
        run: |
          foreach ($project in @('Update/Update.csproj', 'EditHostFile/EditHostFile.csproj')) {
            dotnet build $project -c Release -p:Platform=x64
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $name = [System.IO.Path]::GetFileNameWithoutExtension($project)
            $out = "artifacts/tools/$name"
            dotnet publish $project -c Release -p:Platform=x64 -r win-x64 --self-contained false -p:PublishSingleFile=true -o $out
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $files = @(Get-ChildItem -LiteralPath $out -File | Where-Object { $_.Extension -ne '.pdb' })
            if ($files.Count -ne 1 -or $files[0].Name -ne "$name.exe") {
              throw "$name must publish only $name.exe, found: $($files.Name -join ', ')"
            }
          }

      # Native AOT, as build_portable.ps1 publishes it: the launcher has no .NET host, so the .NET
      # variables of the user profile do not act on it. The native link uses the C++ build tools
      # of the hosted image. A trim or AOT warning fails the job.
      - name: Build and publish CDPIUI.ElevatedLauncher
        shell: pwsh
        run: |
          $project = 'CDPIUI.ElevatedLauncher/CDPIUI.ElevatedLauncher.csproj'
          dotnet build $project -c Release -p:Platform=x64 -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $out = 'artifacts/tools/launcher'
          dotnet publish $project -c Release -p:Platform=x64 -r win-x64 -p:TreatWarningsAsErrors=true -o $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @(Get-ChildItem -LiteralPath $out -File | Where-Object { $_.Extension -ne '.pdb' })
          if ($files.Count -ne 1 -or $files[0].Name -ne 'CDPIUI_ElevatedLauncher.exe') {
            throw "CDPIUI.ElevatedLauncher must publish only CDPIUI_ElevatedLauncher.exe, found: $($files.Name -join ', ')"
          }
          $managed = $true
          try { [void][System.Reflection.AssemblyName]::GetAssemblyName($files[0].FullName) } catch { $managed = $false }
          if ($managed) { throw 'CDPIUI_ElevatedLauncher.exe is a .NET assembly. It must be a Native AOT executable.' }

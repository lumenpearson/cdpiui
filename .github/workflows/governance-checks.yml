name: Governance checks

on:
  pull_request:
  push:
    branches: [main, 'dev/**', 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Test contribution validation
        run: python -m unittest discover -s .github/scripts/tests -v
      - name: Check documentation links and governance data
        run: python .github/scripts/check_governance.py
      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD

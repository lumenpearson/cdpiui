name: Contribution metadata

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, assigned, unassigned, milestoned, demilestoned, ready_for_review, converted_to_draft]
  issues:
    types: [edited, labeled, unlabeled, assigned, unassigned, milestoned, demilestoned, reopened, closed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to recheck against current metadata
        required: true
        type: number

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: contribution-metadata-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pull_request || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only trusted main code runs with statuses:write. Never check out PR code here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate current metadata and publish a status on the current PR head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python .github/scripts/contribution_metadata.py

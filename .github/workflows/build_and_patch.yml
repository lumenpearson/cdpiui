name: Build release files (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for requirements.json (empty: FileVersion of CDPIUI.csproj)'
        required: false
        default: ''
      previous_repository:
        description: 'Repository whose release holds the previous _portable.zip'
        required: false
        default: 'Storik4pro/cdpiui'
      previous_tag:
        description: 'Release tag of the previous _portable.zip (empty: latest release, "none": full patch)'
        required: false
        default: ''
      patch_urls:
        description: 'Patches that must be installed first, separated by spaces (requirements.json patch_urls)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: microsoft/setup-msbuild@v2

      - name: Build portable layout
        shell: pwsh
        run: ./.github/scripts/build_portable.ps1

      - name: Check installer file list
        shell: pwsh
        run: ./.github/scripts/check_setup_files.ps1

      - name: Build Setup.msi
        run: dotnet build NewSetup/NewSetup.wixproj -c Release -p:Platform=x64

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:INPUT_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = ([xml](Get-Content CDPIUI/CDPIUI.csproj)).Project.PropertyGroup.FileVersion | Where-Object { $_ } | Select-Object -First 1
          }
          if ($version -notmatch '^\d+(\.\d+){1,3}$') { throw "Invalid version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Download previous _portable.zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_REPOSITORY: ${{ inputs.previous_repository }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          if ($env:PREVIOUS_TAG -eq 'none') { exit 0 }
          $tagArgs = @()
          if (-not [string]::IsNullOrWhiteSpace($env:PREVIOUS_TAG)) { $tagArgs = @($env:PREVIOUS_TAG) }
          gh release download @tagArgs --repo $env:PREVIOUS_REPOSITORY --pattern _portable.zip --output prev_portable.zip
          if ($LASTEXITCODE -ne 0) { throw "Cannot download _portable.zip from $env:PREVIOUS_REPOSITORY" }

      - name: Create portable zip and patch
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PATCH_URLS: ${{ inputs.patch_urls }}
          CATALOG_CERTIFICATE: ${{ secrets.CATALOG_CERTIFICATE_PFX_BASE64 }}
          CATALOG_CERTIFICATE_PASSWORD: ${{ secrets.CATALOG_CERTIFICATE_PASSWORD }}
        run: |
          $publish = "CDPIUI/bin/x64/Release/net8.0-windows10.0.22621.0/publish"
          New-Item -ItemType Directory -Force out | Out-Null

          $certPath = ""
          if ($env:CATALOG_CERTIFICATE) {
            $certPath = Join-Path $env:RUNNER_TEMP "catalog.pfx"
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CATALOG_CERTIFICATE))
          }

          try {
            $prev = if (Test-Path prev_portable.zip) { "prev_portable.zip" } else { "" }
            $urls = @($env:PATCH_URLS -split '\s+' | Where-Object { $_ })
            ./.github/scripts/make_patch.ps1 -CurrentDir $publish -PreviousZip $prev -Version $env:VERSION `
              -PatchUrls $urls -OutPatch "out/$($env:VERSION)_patch.cdpipatch" `
              -CertificatePath $certPath -CertificatePassword $env:CATALOG_CERTIFICATE_PASSWORD

            # The portable build ships the updater as _Update.exe like the published one,
            # with a catalog of the whole folder.
            $portable = Join-Path $env:RUNNER_TEMP "portable"
            Copy-Item -Recurse $publish $portable
            Move-Item (Join-Path $portable "Update.exe") (Join-Path $portable "_Update.exe")
            $catalog = Join-Path $env:RUNNER_TEMP "catalog.cat"
            New-FileCatalog -Path $portable -CatalogFilePath $catalog -CatalogVersion 2.0 | Out-Null
            if ($certPath) {
              $cert = Get-PfxCertificate -FilePath $certPath -Password (ConvertTo-SecureString $env:CATALOG_CERTIFICATE_PASSWORD -AsPlainText -Force)
              Set-AuthenticodeSignature -FilePath $catalog -Certificate $cert -HashAlgorithm SHA256 | Out-Null
            }
            Move-Item $catalog (Join-Path $portable "catalog.cat")
            Compress-Archive -Path "$portable/*" -DestinationPath out/_portable.zip
          }
          finally {
            if ($certPath) { Remove-Item $certPath -Force -ErrorAction SilentlyContinue }
          }

          $msi = Get-ChildItem NewSetup/bin -Recurse -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw "Setup.msi was not built" }
          Copy-Item $msi.FullName out/Setup.msi

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version }}
          path: out/
